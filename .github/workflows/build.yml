name: Build

on: [push, workflow_dispatch, pull_request]

permissions:
  contents: write

jobs:
  build-windows-x86:
    name: Win32 Build
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    # Prebuilt libjpeg/libpng/speex were compiled with /GL by another MSVC
    # version -> C1047 with LTO. Rebuild them here from the same sources.
    - name: Rebuild libjpeg, libpng, speex for LTO
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $root = $PWD.Path
        $out  = "$root\lib\win32"
        $cf   = @('/nologo','/c','/O2','/MT','/GL','/W0','/DNDEBUG','/D_CRT_SECURE_NO_WARNINGS')
        function Build-Lib([string]$name, [string[]]$srcs, [string[]]$extra) {
          $obj = "$root\ltolibs\$name"
          New-Item -ItemType Directory -Force $obj | Out-Null
          & cl @cf @extra "/Fo$obj\" @srcs
          if ($LASTEXITCODE -ne 0) { throw "cl failed for $name" }
          $objs = (Get-ChildItem "$obj\*.obj").FullName
          & lib /nologo /LTCG "/OUT:$out\$name.lib" @objs
          if ($LASTEXITCODE -ne 0) { throw "lib failed for $name" }
          Write-Host "$name.lib rebuilt from $($objs.Count) objects"
        }

        # libjpeg 9a
        $j = "$root\thirdparty\libjpeg"
        $jsrc = 'jmemnobs jaricom jcapimin jcapistd jcarith jccoefct jccolor jcdctmgr jchuff jcinit jcmainct jcmarker jcmaster jcomapi jcparam jcprepct jcsample jctrans jdapimin jdapistd jdarith jdatadst jdatasrc jdcoefct jdcolor jddctmgr jdhuff jdinput jdmainct jdmarker jdmaster jdmerge jdpostct jdsample jdtrans jerror jfdctflt jfdctfst jfdctint jidctflt jidctfst jidctint jquant1 jquant2 jutils jmemmgr'.Split(' ') | ForEach-Object { "$j\$_.c" }
        Build-Lib 'libjpeg' $jsrc @("/I$j")

        # libpng 1.6.38
        $p = "$root\thirdparty\libpng"
        $psrc = 'png pngerror pngget pngmem pngpread pngread pngrio pngrtran pngrutil pngset pngtrans pngwio pngwrite pngwtran pngwutil'.Split(' ') | ForEach-Object { "$p\$_.c" }
        Build-Lib 'libpng' $psrc @("/I$p", "/I$root\thirdparty\zlib")

        # speex 1.2.1 (same version as the old prebuilt speex.lib)
        Invoke-WebRequest 'https://github.com/xiph/speex/archive/refs/tags/Speex-1.2.1.tar.gz' -OutFile "$root\speex.tgz"
        tar -xzf "$root\speex.tgz" -C "$root\ltolibs"
        $s = "$root\ltolibs\speex-Speex-1.2.1"
        Copy-Item "$root\engine\voice_codecs\speex\speex\speex_config_types.h" "$s\include\speex\" -Force
        $ssrc = (Get-ChildItem "$s\libspeex\*.c" | Where-Object { $_.Name -notlike 'test*' }).FullName
        Build-Lib 'speex' $ssrc @('/DHAVE_CONFIG_H', "/I$s\win32", "/I$s\include", "/I$s\libspeex")

    - name: Build windows-x86 (release)
      run: |
        python waf configure -T release -4 --enable-lto --enable-speex --enable-opus --build-games=cstrike --prefix=./win32_build
        python waf install

    - name: Pack game and debug symbols
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force pdb | Out-Null
        $names = Get-ChildItem win32_build -Recurse -Include *.dll,*.exe | ForEach-Object { $_.BaseName }
        Get-ChildItem build -Recurse -Filter *.pdb | Where-Object { $names -contains $_.BaseName } | ForEach-Object { Copy-Item $_.FullName pdb\ -Force }
        Get-ChildItem pdb | Format-Table Name, Length
        7z a -mx9 cssv34_win32_pdb.7z .\pdb\*
        7z a -tzip cssv34_win32_optimized.zip .\win32_build\*

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows_build
        path: |
          cssv34_win32_optimized.zip
          cssv34_win32_pdb.7z
        if-no-files-found: error
        retention-days: 7
        
  build-windows-amd64:
    name: Win64 Build
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # Prebuilt libjpeg/libpng/speex were compiled with /GL by another MSVC
    # version -> C1047 with LTO. Rebuild them here from the same sources.
    - name: Rebuild libjpeg, libpng, speex for LTO
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $root = $PWD.Path
        $out  = "$root\lib\win32\amd64"
        $cf   = @('/nologo','/c','/O2','/MT','/GL','/W0','/DNDEBUG','/D_CRT_SECURE_NO_WARNINGS')
        function Build-Lib([string]$name, [string[]]$srcs, [string[]]$extra) {
          $obj = "$root\ltolibs\$name"
          New-Item -ItemType Directory -Force $obj | Out-Null
          & cl @cf @extra "/Fo$obj\" @srcs
          if ($LASTEXITCODE -ne 0) { throw "cl failed for $name" }
          $objs = (Get-ChildItem "$obj\*.obj").FullName
          & lib /nologo /LTCG "/OUT:$out\$name.lib" @objs
          if ($LASTEXITCODE -ne 0) { throw "lib failed for $name" }
          Write-Host "$name.lib rebuilt from $($objs.Count) objects"
        }

        # libjpeg 9a
        $j = "$root\thirdparty\libjpeg"
        $jsrc = 'jmemnobs jaricom jcapimin jcapistd jcarith jccoefct jccolor jcdctmgr jchuff jcinit jcmainct jcmarker jcmaster jcomapi jcparam jcprepct jcsample jctrans jdapimin jdapistd jdarith jdatadst jdatasrc jdcoefct jdcolor jddctmgr jdhuff jdinput jdmainct jdmarker jdmaster jdmerge jdpostct jdsample jdtrans jerror jfdctflt jfdctfst jfdctint jidctflt jidctfst jidctint jquant1 jquant2 jutils jmemmgr'.Split(' ') | ForEach-Object { "$j\$_.c" }
        Build-Lib 'libjpeg' $jsrc @("/I$j")

        # libpng 1.6.38
        $p = "$root\thirdparty\libpng"
        $psrc = 'png pngerror pngget pngmem pngpread pngread pngrio pngrtran pngrutil pngset pngtrans pngwio pngwrite pngwtran pngwutil'.Split(' ') | ForEach-Object { "$p\$_.c" }
        Build-Lib 'libpng' $psrc @("/I$p", "/I$root\thirdparty\zlib")

        # speex 1.2.1 (same version as the old prebuilt speex.lib)
        Invoke-WebRequest 'https://github.com/xiph/speex/archive/refs/tags/Speex-1.2.1.tar.gz' -OutFile "$root\speex.tgz"
        tar -xzf "$root\speex.tgz" -C "$root\ltolibs"
        $s = "$root\ltolibs\speex-Speex-1.2.1"
        Copy-Item "$root\engine\voice_codecs\speex\speex\speex_config_types.h" "$s\include\speex\" -Force
        $ssrc = (Get-ChildItem "$s\libspeex\*.c" | Where-Object { $_.Name -notlike 'test*' }).FullName
        Build-Lib 'speex' $ssrc @('/DHAVE_CONFIG_H', "/I$s\win32", "/I$s\include", "/I$s\libspeex")

    - name: Build windows-amd64 (release)
      run: |
        python waf configure -T release --enable-lto --enable-speex --enable-opus --build-games=cstrike --prefix=./win64_build
        python waf install

    - name: Pack game and debug symbols
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force pdb | Out-Null
        $names = Get-ChildItem win64_build -Recurse -Include *.dll,*.exe | ForEach-Object { $_.BaseName }
        Get-ChildItem build -Recurse -Filter *.pdb | Where-Object { $names -contains $_.BaseName } | ForEach-Object { Copy-Item $_.FullName pdb\ -Force }
        Get-ChildItem pdb | Format-Table Name, Length
        7z a -mx9 cssv34_win64_pdb.7z .\pdb\*
        7z a -tzip cssv34_win64_optimized.zip .\win64_build\*

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows_build
        path: |
          cssv34_win64_optimized.zip
          cssv34_win64_pdb.7z
        if-no-files-found: error
        retention-days: 7

  build-android-armv7a:
    name: armeabi-v7a Android Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build android-armv7a
      run: |
        chmod +x waf
        chmod +x scripts/build-android-armv7a.sh
        ./scripts/build-android-armv7a.sh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android_armv7a_build
        path: android_armv7a_build
        if-no-files-found: error
        retention-days: 7
        
  build-android-arm64:
    name: arm64-v8a Android Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build android-arm64
      run: |
        chmod +x waf
        chmod +x scripts/build-android-arm64.sh
        ./scripts/build-android-arm64.sh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android_arm64_build
        path: android_arm64_build
        if-no-files-found: error
        retention-days: 7
        
  build-linux-srcds:
    name: srcds Linux Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build srcds-linux
      run: |
        chmod +x waf
        chmod +x scripts/srcds-linux.sh
        ./scripts/srcds-linux.sh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: srcds_linux
        path: srcds_linux
        if-no-files-found: error
        retention-days: 7

  release:
    needs: [build-windows-amd64, build-android-armv7a, build-windows-x86, build-android-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows_build
        path: release_files

    - name: Download Android artifacts
      uses: actions/download-artifact@v4
      with:
        name: android_armv7a_build
        path: release_files/android_armv7a_build

    - name: Download Android (arm64) artifacts
      uses: actions/download-artifact@v4
      with:
        name: android_arm64_build
        path: release_files/android_arm64_build

    - name: Pack Android build
      run: |
        cd release_files
        zip -r cssv34_android_armv7a.zip android_armv7a_build
        zip -r cssv34_android_arm64.zip android_arm64_build

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: |
          release_files/cssv34_win64_optimized.zip
          release_files/cssv34_win64_pdb.7z
          release_files/cssv34_win32_optimized.zip
          release_files/cssv34_win32_pdb.7z
          release_files/cssv34_android_armv7a.zip
          release_files/cssv34_android_arm64.zip
