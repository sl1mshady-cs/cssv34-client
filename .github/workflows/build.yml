name: Build

on: [push, pull_request]

jobs:
  build-windows-amd64:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2
    - name: Build windows-amd64
      run: |
        git submodule init && git submodule update
        python waf configure -T release --enable-speex --enable-opus --build-games=cstrike --prefix=./win64_build
        python waf install
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: win64_build
        path: win64_build
        if-no-files-found: error
        retention-days: 7
        
  build-windows-i386:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2
    - name: Build windows-i386
      run: |
        git submodule init && git submodule update
        python waf configure -T release --32bits --enable-speex --enable-opus --build-games=cstrike --prefix=./win32_build
        python waf install
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: win32_build
        path: win32_build
        if-no-files-found: error
        retention-days: 7
        
  build-linux-i386:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Build linux-i386
      run: |
        chmod +x waf
        chmod +x scripts/build-ubuntu-i386.sh
        ./scripts/build-ubuntu-i386.sh

    - name: Upload artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: linux_i386_build
        path: linux_i386_build
        if-no-files-found: error
        retention-days: 7
        
  build-linux-amd64:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Build linux-amd64
      run: |
        chmod +x waf
        chmod +x scripts/build-ubuntu-amd64.sh
        ./scripts/build-ubuntu-amd64.sh

    - name: Upload artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: linux_amd64_build
        path: linux_amd64_build
        if-no-files-found: error
        retention-days: 7

  build-android-armv7a:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Build android-armv7a
      run: |
        chmod +x waf
        chmod +x scripts/build-android-armv7a.sh
        ./scripts/build-android-armv7a.sh

    - name: Upload artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: android_armv7a_build
        path: android_armv7a_build
        if-no-files-found: error
        retention-days: 7
