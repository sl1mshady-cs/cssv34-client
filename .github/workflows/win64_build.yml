name: Build Win64

on: [push, pull_request]

jobs:
  build-windows-amd64:
    runs-on: windows-2019

    steps:
    - uses: actions/checkout@v2
    - name: Build windows-amd64
      run: |
        git submodule init && git submodule update
        python waf configure -T release --enable-speex --enable-opus --build-games=cstrike
        python waf build
